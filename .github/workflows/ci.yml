name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Reviewed CI only: installs, lints, builds. No auto-fix, no auto-push, no deploy.
jobs:
  backend:
    name: Backend (install/check/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velodrive-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: velodrive-app/backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
        env:
          NODE_ENV: test

  frontend:
    name: Frontend (install/lint/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velodrive-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: velodrive-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
